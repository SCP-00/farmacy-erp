[package]
name = "farmacy-desktop"
version = "1.0.0"
description = "Farmacy — Sistema ERP de farmacia (POS offline-first)"
authors = ["Farmacy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Binario pequeño y rápido: el POS corre en PCs modestos de farmacia
codegen-units = 1
lto = true
opt-level = "s"
strip = true
