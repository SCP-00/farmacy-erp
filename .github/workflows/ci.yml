# ══════════════════════════════════════════════════════════
#  FARMACY — CI Pipeline
#  Corre en cada push a main y en cada PR.
#
#  Jobs:
#    1. backend — typecheck + tests + build
#    2. frontend — typecheck + build
#    3. prisma — genera client y verifica schema
#
#  ⚠️  Monorepo pnpm: todas las instalaciones desde raíz.
#     El lock file está en pnpm-lock.yaml (raíz).
#     backend/pnpm-lock.yaml es un artefacto antiguo — no usar.
# ══════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  # ── Backend: typecheck + tests + build ─────────────────
  backend:
    name: Backend (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: farmacy_db
          POSTGRES_USER: farmacy_user
          POSTGRES_PASSWORD: farmacy_pass
        options: >-
          --health-cmd "pg_isready -U farmacy_user -d farmacy_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: "postgresql://farmacy_user:farmacy_pass@localhost:5432/farmacy_db"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "test_jwt_secret_minimo_32_caracteres_para_ci"
      JWT_REFRESH_SECRET: "test_refresh_secret_minimo_32_caracteres_para_ci"
      JWT_CLIENTE_SECRET: "test_cliente_secret_minimo_32_caracteres_ci"
      NODE_ENV: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate --schema=../database/prisma/schema.prisma

      - name: Deploy database migrations
        working-directory: ./backend
        run: npx prisma migrate deploy --schema=../database/prisma/schema.prisma

      - name: Seed database
        working-directory: ./backend
        run: pnpm exec tsx ../database/seeds/seed.ts

      - name: TypeScript check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./backend
        continue-on-error: true
        run: pnpm run test

      - name: Build
        working-directory: ./backend
        run: pnpm run build
        env:
          NODE_ENV: "production"

  # ── Frontend: typecheck + build ────────────────────────
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build (CI sin prerender — sin backend disponible)
        working-directory: ./frontend
        run: pnpm run build
        env:
          VITE_API_URL: "http://localhost:3000/api/v1"
          VITE_APP_NAME: "Farmacy CI"

  # ── Prisma: verifica que el schema compile ────────────
  prisma:
    name: Prisma schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DATABASE_URL: "postgresql://farmacy_user:farmacy_pass@localhost:5432/farmacy_db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        working-directory: ./backend
        run: npx prisma validate --schema=../database/prisma/schema.prisma

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate --schema=../database/prisma/schema.prisma
